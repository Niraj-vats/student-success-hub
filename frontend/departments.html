<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar will be injected here -->
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>Department Management</h1>
                </div>
                <div id="user-profile-container"></div>
            </header>

            <div class="content-body">
                <div class="action-bar">
                    <button id="add-dept-btn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Department
                    </button>
                </div>

                <div class="card table-card">
                    <table id="dept-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="dept-table-body">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Department Modal -->
    <div id="dept-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Department</h2>
            <form id="dept-form">
                <input type="hidden" id="dept-id">
                <div class="form-group">
                    <label for="dept-code">Department Code</label>
                    <input type="text" id="dept-code" required placeholder="e.g., CSE">
                </div>
                <div class="form-group">
                    <label for="dept-name">Department Name</label>
                    <input type="text" id="dept-name" required placeholder="e.g., Computer Science & Engineering">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Department</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from './js/auth-check.js';
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            const { initDepartments } = await import('./js/departments.js');
            initDepartments();
        });
    </script>
</body>
</html>
