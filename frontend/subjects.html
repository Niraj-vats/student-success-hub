<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="js/auth-check.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <nav class="sidebar" style="display: flex; flex-direction: column; height: 100vh;">
        <div class="sidebar-header">
            <h2>SMS Portal</h2>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
            <li><a href="students.html"><i class="fas fa-user-graduate"></i> <span>Students</span></a></li>
            <li><a href="subjects.html" class="active"><i class="fas fa-book"></i> <span>Subjects</span></a></li>
            <li><a href="marks.html"><i class="fas fa-file-invoice"></i> <span>Marks</span></a></li>
            <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> <span>Attendance</span></a></li>
            <li><a href="performance.html"><i class="fas fa-chart-line"></i> <span>Performance</span></a></li>
            <li><a href="results.html"><i class="fas fa-poll-h"></i> <span>Results</span></a></li>
            <li><a href="reports.html"><i class="fas fa-file-alt"></i> <span>Reports</span></a></li>
        </ul>
        <div class="sidebar-footer" style="padding: 1rem; border-top: 1px solid #2d3748; margin-top: auto;">
            <div style="color: white; margin-bottom: 1rem;">
                <i class="fas fa-user-circle"></i> 
                <span id="user-display-name" style="font-weight: 600;"></span>
                <br>
                <small id="user-display-role" style="color: #a0aec0; text-transform: uppercase; font-size: 0.7rem;"></small>
            </div>
            <button onclick="logout()" style="width: 100%; background: #c53030; color: white; border: none; padding: 0.5rem; border-radius: 4px; cursor: pointer;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header>
            <div class="page-title">
                <h1>Subject Management</h1>
            </div>
            <button class="btn btn-primary" onclick="openModal()">Add New Subject</button>
        </header>

        <div class="filters card" style="margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 200px;">
                <label>Search Subjects</label>
                <input type="text" id="searchInput" placeholder="Search by Code or Name..." oninput="filterSubjects()">
            </div>
            <div class="form-group" style="margin-bottom: 0; width: 150px;">
                <label>Semester</label>
                <select id="semFilter" onchange="filterSubjects()">
                    <option value="">All Semesters</option>
                    <!-- Semesters will be loaded dynamically -->
                </select>
            </div>
            <button class="btn" style="background: #64748b; color: white;" onclick="clearFilters()">Clear</button>
        </div>

        <div class="card">
            <div id="noSubjectsMessage" style="display: none; text-align: center; padding: 40px; color: #64748b;">
                <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                <p>No subjects found matching your criteria.</p>
            </div>
            <table id="subjectsTable">
                <thead>
                    <tr>
                        <th>Subject Code</th>
                        <th>Subject Name</th>
                        <th>Semester</th>
                        <th>Credits</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="subject-list">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="subjectModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Subject</h3>
            <form id="subjectForm">
                <input type="hidden" id="subjectIdx">
                <div class="form-group">
                    <label>Subject Code</label>
                    <input type="text" id="subject_code" required>
                </div>
                <div class="form-group">
                    <label>Subject Name</label>
                    <input type="text" id="subject_name" required>
                </div>
                <div class="form-group">
                    <label>Semester</label>
                    <input type="number" id="semester" required min="1" max="8">
                </div>
                <div class="form-group">
                    <label>Credits</label>
                    <input type="number" id="credits" required min="1" max="10">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { openModal, closeModal, editSubject, deleteSubject, filterSubjects, clearFilters } from './js/subjects.js';
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.editSubject = editSubject;
        window.deleteSubject = deleteSubject;
        window.filterSubjects = filterSubjects;
        window.clearFilters = clearFilters;
    </script>
</body>
</html>
