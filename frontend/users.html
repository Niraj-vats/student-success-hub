<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module">
        import { checkAuth } from './js/auth-check.js';
        checkAuth(true);
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - SMS Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 500px;
            max-width: 90%;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-active { background: #def7ec; color: #03543f; }
        .status-inactive { background: #fde8e8; color: #9b1c1c; }
        .role-badge {
            background: #e1effe;
            color: #1e429f;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <nav class="sidebar" style="display: flex; flex-direction: column; height: 100vh;">
        <div class="sidebar-header">
            <h2>SMS Portal</h2>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
            <li><a href="students.html"><i class="fas fa-user-graduate"></i> <span>Students</span></a></li>
            <li><a href="subjects.html"><i class="fas fa-book"></i> <span>Subjects</span></a></li>
            <li><a href="departments.html"><i class="fas fa-building"></i> <span>Departments</span></a></li>
            <li><a href="classes.html"><i class="fas fa-chalkboard"></i> <span>Classes</span></a></li>
            <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> <span>Teachers</span></a></li>
            <li><a href="teacher-assignments.html"><i class="fas fa-tasks"></i> <span>Assignments</span></a></li>
            <li><a href="users.html" class="active"><i class="fas fa-users-cog"></i> <span>Users</span></a></li>
            <li><a href="marks.html"><i class="fas fa-file-invoice"></i> <span>Marks</span></a></li>
            <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> <span>Attendance</span></a></li>
            <li><a href="performance.html"><i class="fas fa-chart-line"></i> <span>Performance</span></a></li>
            <li><a href="results.html"><i class="fas fa-poll-h"></i> <span>Results</span></a></li>
            <li><a href="reports.html"><i class="fas fa-file-alt"></i> <span>Reports</span></a></li>
        </ul>
        <div class="sidebar-footer" style="padding: 1rem; border-top: 1px solid #2d3748; margin-top: auto;">
            <div style="color: white; margin-bottom: 1rem;">
                <i class="fas fa-user-circle"></i> 
                <span id="user-display-name" style="font-weight: 600;"></span>
                <br>
                <small id="user-display-role" style="color: #a0aec0; text-transform: uppercase; font-size: 0.7rem;"></small>
            </div>
            <button onclick="logout()" style="width: 100%; background: #c53030; color: white; border: none; padding: 0.5rem; border-radius: 4px; cursor: pointer;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <main class="main-content">
        <header>
            <div class="page-title">
                <h1>User Management</h1>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">Create User Account</button>
        </header>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Linked Profile</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Data loaded via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Create User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Create User Account</h3>
            <form id="userForm">
                <div class="form-group">
                    <label>Role</label>
                    <select id="role" required onchange="handleRoleChange()">
                        <option value="Admin">Admin</option>
                        <option value="Teacher">Teacher</option>
                        <option value="Student">Student</option>
                    </select>
                </div>
                
                <div id="profile-selection" style="display:none;">
                    <div class="form-group" id="teacher-selection" style="display:none;">
                        <label>Select Teacher</label>
                        <select id="teacher_id">
                            <option value="">-- Select Teacher --</option>
                        </select>
                    </div>
                    <div class="form-group" id="student-selection" style="display:none;">
                        <label>Select Student</label>
                        <select id="student_id">
                            <option value="">-- Select Student --</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('userModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <h3>Reset Password</h3>
            <form id="passwordForm">
                <input type="hidden" id="reset-user-id">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reset-username" disabled>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="new-password" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('passwordModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/users.js"></script>
    <script type="module">
        import { logout } from './js/auth-check.js';
        window.logout = logout;
    </script>
</body>
</html>
