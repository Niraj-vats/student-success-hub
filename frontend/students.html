<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 500px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>SMS Portal</h2>
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a></li>
            <li><a href="students.html" class="active"><i class="fas fa-user-graduate"></i> <span>Students</span></a></li>
            <li><a href="subjects.html"><i class="fas fa-book"></i> <span>Subjects</span></a></li>
            <li><a href="marks.html"><i class="fas fa-file-invoice"></i> <span>Marks</span></a></li>
            <li><a href="attendance.html"><i class="fas fa-calendar-check"></i> <span>Attendance</span></a></li>
            <li><a href="performance.html"><i class="fas fa-chart-line"></i> <span>Performance</span></a></li>
            <li><a href="results.html"><i class="fas fa-poll-h"></i> <span>Results</span></a></li>
            <li><a href="reports.html"><i class="fas fa-file-alt"></i> <span>Reports</span></a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <div class="page-title">
                <h1>Student Management</h1>
            </div>
            <button class="btn btn-primary" onclick="openModal()">Add New Student</button>
        </header>

        <div class="filters card" style="margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 200px;">
                <label>Search Students</label>
                <input type="text" id="searchInput" placeholder="Search by Name, ID, Roll, Dept, or Email..." oninput="filterStudents()">
            </div>
            <div class="form-group" style="margin-bottom: 0; width: 150px;">
                <label>Department</label>
                <select id="deptFilter" onchange="filterStudents()">
                    <option value="">All Departments</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0; width: 120px;">
                <label>Semester</label>
                <select id="semFilter" onchange="filterStudents()">
                    <option value="">All Semesters</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>
            <button class="btn" style="background: #64748b; color: white;" onclick="clearFilters()">Clear</button>
        </div>

        <div class="card">
            <div id="noStudentsMessage" style="display: none; text-align: center; padding: 40px; color: #64748b;">
                <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.3;"></i>
                <p>No students found matching your criteria.</p>
            </div>
            <table id="studentsTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Department</th>
                        <th>Semester</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-list">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Student</h3>
            <form id="studentForm">
                <input type="hidden" id="studentIdx">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="student_id" required>
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Roll Number</label>
                    <input type="text" id="roll_number" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department" required>
                </div>
                <div class="form-group">
                    <label>Semester</label>
                    <input type="number" id="semester" required min="1" max="8">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone" required>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
      import { openModal, closeModal, editStudent, deleteStudent, filterStudents, clearFilters } from './js/students.js';
      window.openModal = openModal;
      window.closeModal = closeModal;
      window.editStudent = editStudent;
      window.deleteStudent = deleteStudent;
      window.filterStudents = filterStudents;
      window.clearFilters = clearFilters;
    </script>
</body>
</html>
