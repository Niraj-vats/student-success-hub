<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Assignments - Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>Teacher Assignments</h1>
                </div>
                <div id="user-profile-container"></div>
            </header>
            <div class="content-body">
                <div class="action-bar">
                    <button id="add-assignment-btn" class="btn btn-primary">
                        <i class="fas fa-plus"></i> New Assignment
                    </button>
                </div>
                <div class="card table-card">
                    <table id="assignment-table">
                        <thead>
                            <tr>
                                <th>Teacher</th>
                                <th>Class</th>
                                <th>Subject</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="assignment-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="assignment-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">New Assignment</h2>
            <form id="assignment-form">
                <input type="hidden" id="assignment-id">
                <div class="form-group">
                    <label for="teacher-select">Teacher</label>
                    <select id="teacher-select" required></select>
                </div>
                <div class="form-group">
                    <label for="class-select">Class</label>
                    <select id="class-select" required></select>
                </div>
                <div class="form-group">
                    <label for="subject-select">Subject</label>
                    <select id="subject-select" required></select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Assignment</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from './js/auth-check.js';
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            const { initAssignments } = await import('./js/teacher-assignments.js');
            initAssignments();
        });
    </script>
</body>
</html>
